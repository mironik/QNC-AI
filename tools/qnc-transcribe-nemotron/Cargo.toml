[package]
name = "qnc-transcribe-nemotron"
version = "0.1.0"
edition = "2021"
description = "QNC transcription plug-in: speech to text with NVIDIA Nemotron 3.5 ASR Streaming (multilingual, cache-aware) through sherpa-onnx's streaming recognizer on the processor (contract qnc.transcribe 2), as its own program; the live transcript while a clip plays"

[dependencies]
qnc-dev-diagnostics = { workspace = true }
qnc-transcribe-jobs = { workspace = true }
libloading = "0.8"
