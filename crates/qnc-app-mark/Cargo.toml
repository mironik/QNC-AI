[package]
name = "qnc-app-mark"
version.workspace = true
edition.workspace = true
description = "QNC-AI block: the QNC mark (white QNC in a rounded square) as RGBA pixels of a given size, for the tray icon; it draws nothing on screen itself and knows no system"

[dependencies]
ab_glyph = "0.2.32"
epaint_default_fonts = "0.31.1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
