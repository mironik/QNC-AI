[package]
name = "qnc-camera-qnc-base"
version = "0.1.0"
edition = "2021"
description = "QNC public camera adapter for a QNC card base (the standardized quasi card the tray's ingest makes): its index QNCCARD.JSON lists the clips with their original, proxy, poster and the clip's finished record; Select reads it as any card; no I/O, no DB, no UI"

[dependencies]
qnc-camera-adapter = { workspace = true }
qnc-media-metadata = { workspace = true }
qnc-source-contract = { workspace = true }
qnc-source-groups = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
qnc-camera-detector = { workspace = true }
qnc-camera-patterns = { workspace = true }
qnc-scanner = { workspace = true }
qnc-source-reader = { workspace = true }
qnc-transport-resolver = { workspace = true }
