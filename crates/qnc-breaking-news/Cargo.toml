[package]
name = "qnc-breaking-news"
version.workspace = true
edition.workspace = true
description = "QNC-AI block: a card chosen in the Ingest form makes a breaking news project by itself (named by its date and time, linking the card, with the news AI); no GUI"

[dependencies]
qnc-project-store = { workspace = true }
qnc-application-catalog = { workspace = true }
qnc-ai-features = { workspace = true }
qnc-ingest-base = { workspace = true }
qnc-wizard-text = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
