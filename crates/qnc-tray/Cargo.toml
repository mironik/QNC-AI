[package]
name = "qnc-tray"
version.workspace = true
edition.workspace = true
description = "QNC-AI block: an icon in the system tray with its menu and notices, and one running copy of a program; an adapter per system (Windows first)"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
