[package]
name = "qnc-wizard-open"
version = "0.1.0"
edition = "2021"
description = "QNC Wizard block: opens the Wizard's desktop (qnc-app beside this program) unless that very program already runs; the tray in Breaking news opens it once a card is copied"

[dependencies]
qnc-plugin-process = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
