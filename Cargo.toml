[workspace]
resolver = "2"
members = ["apps/*", "crates/*", "tools/*"]
# Built only with the `libav` feature of a program (needs the FFmpeg development files).
exclude = ["crates/qnc-libav-decode"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# QNC-AI stands on its own (user 2026-11-11: "QNC-AI je samostalan, on samo kopira kod kocki koje
# postoje za samostalni rad"): the QNC blocks it works with are copies in crates/ and tools/ (taken
# from QNC at the tag v-2026-11-11, AGENTS.md lists them); nothing is fetched from QNC and nothing
# of QNC's folder is used at run time.
[workspace.dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
qnc-action-event = { path = "../QNC-shared/crates/qnc-action-event" }
qnc-active-project-read = { path = "../QNC-shared/crates/qnc-active-project-read" }
qnc-ai-catalog = { path = "../QNC-shared/crates/qnc-ai-catalog" }
