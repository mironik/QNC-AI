[workspace]
resolver = "2"
members = [
    "apps/qnc-ai-tray",
    "crates/qnc-card-eject",
    "crates/qnc-card-watch",
    "crates/qnc-tray",
    "crates/qnc-wizard-db",
    "crates/qnc-wizard-flow",
    "crates/qnc-wizard-steps",
    "crates/qnc-wizard-text",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# QNC's blocks, locked to a tag of QNC (docs/01-wizard-plan.md, section 3). A block the
# wizard changes is taken into crates/ here and every dependency is pointed at it with
# [patch."https://github.com/mironik/QNC.git"]; AGENTS.md says where each came from.
[workspace.dependencies]
qnc-active-project-read = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-camera-detector = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-camera-patterns = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-source-bindings = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-source-reader = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-source-volumes = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-db-broker = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-dev-diagnostics = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-ui-text = { git = "https://github.com/mironik/QNC.git", tag = "v-2026-11-11" }
qnc-card-eject = { path = "crates/qnc-card-eject" }
qnc-card-watch = { path = "crates/qnc-card-watch" }
qnc-tray = { path = "crates/qnc-tray" }
qnc-wizard-db = { path = "crates/qnc-wizard-db" }
qnc-wizard-flow = { path = "crates/qnc-wizard-flow" }
qnc-wizard-steps = { path = "crates/qnc-wizard-steps" }
qnc-wizard-text = { path = "crates/qnc-wizard-text" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
